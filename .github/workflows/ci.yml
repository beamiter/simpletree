name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: simpletree-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.
  #
  # `uses:` cannot take an expression, so the toolchain below is a literal and
  # the first step is what keeps it honest: it reads rust-version out of
  # Cargo.toml and fails when any pin in this file has drifted from it.  The
  # comment that used to say "keep these in step" did not, and both pins sat at
  # 1.85 against a declared 1.88 for long enough that `cargo check --locked`
  # hard-errored on every push.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain pins match Cargo.toml's rust-version
        shell: bash
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          if [[ -z "$declared" ]]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          mapfile -t pins < <(grep -oE 'dtolnay/rust-toolchain@[0-9]+(\.[0-9]+)*' \
            .github/workflows/ci.yml | sed 's|.*@||' | sort -u)
          if [[ ${#pins[@]} -eq 0 ]]; then
            echo "::error::no dtolnay/rust-toolchain pin found to verify"
            exit 1
          fi
          for pin in "${pins[@]}"; do
            case "$pin" in
              "$declared"|"$declared".*) ;;
              *)
                echo "::error::toolchain pinned to $pin but Cargo.toml declares rust-version $declared"
                exit 1
                ;;
            esac
          done
          echo "rust-version $declared matches pins: ${pins[*]}"

      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked

  # One step, one gate: `make check` is what a contributor runs locally, so CI
  # runs exactly that.  Hand-listing a subset here is how tests/vim_sorting.vim,
  # tests/vim_reveal.vim and `make core-verify` — the sha256 guard that is the
  # entire point of .simplecore.manifest — went unrun for their whole lives.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim

      - name: make check
        run: make check
