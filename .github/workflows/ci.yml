name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: simpletree-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.  Keep the toolchain here in step with rust-version in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim

      - name: Validate shell script
        run: bash -n install.sh

      - name: Check Rust formatting
        run: |
          cargo fmt --all
          git diff -- src tests > rustfmt.patch
          if [[ -s rustfmt.patch ]]; then
            cat rustfmt.patch
            exit 1
          fi

      - name: Upload rustfmt patch
        if: failure() && hashFiles('rustfmt.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: ignore

      - name: Lint Rust
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Clippy log
        if: failure() && hashFiles('clippy.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: ignore

      - name: Test Rust backend
        run: cargo test --locked --all-targets

      - name: Test Vim plugin load
        run: vim -Nu NONE -n -es -X -i NONE -S tests/vim_smoke.vim

      - name: Test Vim runtime controls
        run: vim -Nu NONE -n -es -X -i NONE -S tests/vim_runtime_controls.vim

      - name: Test Vim file operations
        run: vim -Nu NONE -n -es -X -i NONE -S tests/vim_integration.vim

      - name: Test Vim protocol v2 features
        run: vim -Nu NONE -n -es -X -i NONE -S tests/vim_v2_features.vim

      - name: Subtree render cache matches an uncached render
        run: vim -Nu NONE -n -es -X -i NONE -S tests/vim_render_cache.vim

      - name: Compile every Vim9 def (lazy compilation hides cold-branch errors)
        run: make defcompile

      - name: simplecore supervisor regression suite
        run: make vim-core
