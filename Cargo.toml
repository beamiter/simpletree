[package]
name = "simpletree"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "simpletree-daemon"
path = "src/simpletree/simpletree_daemon.rs"

[dependencies]
anyhow = "1.0.100"
ignore = "0.4.23"
notify = "8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.16"

[dev-dependencies]
tempfile = "3.23.0"

# Release tuning enabled 2026-07-26 based on measurements (see CHANGELOG):
# binary 3.75 MB -> 2.06 MB (-45%), startup+ping RTT unchanged (~1.7 ms),
# search walk over 113k files 21 ms -> 20 ms avg. Equal or better across
# the board, so the size win decides it.
#
# `panic = "abort"` was part of that tuning and has been removed: under
# -C panic=abort the process dies at the panic site, unwinding never begins,
# and a tokio JoinError can never be is_panic(). Every line of per-request
# panic containment in this daemon -- finish_request_task, and the doc comment
# on it saying "A failed or panicked request task must not take the daemon
# down" -- was therefore dead in the binary users run, while `cargo test`
# built the dev profile (panic = unwind) and exercised it happily. The
# containment is the behaviour we want from a long-lived editor daemon: one
# bad directory entry must cost one request, not every in-flight request plus
# the watcher's subscriptions. So the strategy stays `unwind`, and
# `the_release_profile_keeps_panics_unwinding` fails if it comes back.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
