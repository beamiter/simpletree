[package]
name = "simpletree"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "simpletree-daemon"
path = "src/simpletree/simpletree_daemon.rs"

[dependencies]
anyhow = "1.0.100"
ignore = "0.4.23"
notify = "8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.16"

[dev-dependencies]
tempfile = "3.23.0"

# Release tuning enabled 2026-07-26 based on measurements (see CHANGELOG):
# binary 3.75 MB -> 2.06 MB (-45%), startup+ping RTT unchanged (~1.7 ms),
# search walk over 113k files 21 ms -> 20 ms avg. Equal or better across
# the board, so the size win decides it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
